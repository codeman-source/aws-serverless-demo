<!DOCTYPE html>
<html>
<head>
  <title>Serverless Demo</title>
</head>
<body>
  <h1>AWS Serverless Demo</h1>

  <button onclick="callApi()">Call API</button>

  <pre id="result"></pre>

  <script>
    async function callApi() {
  try {
    const response = await fetch("https://8zm9przebl.execute-api.us-east-1.amazonaws.com/");

    const data = await response.json();

    document.getElementById("result").textContent =
      JSON.stringify(data, null, 2);

  } catch (error) {
    document.getElementById("result").textContent =
      "Error calling API: " + error;
  }
}

  </script>
</body>
</html>
